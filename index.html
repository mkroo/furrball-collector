<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냥줍쉼터 - Furrball Collector</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js" defer></script>
</head>
<body>
  <div id="app">
    <!-- View Mode Banner (Feature #2) -->
    <div id="view-mode-banner">
      친구의 쉼터를 구경중이에요! 🐱
      <button id="exit-view-btn">내 쉼터로 돌아가기</button>
      <button id="create-own-btn">나도 만들기</button>
    </div>

    <header>
      <div class="header-left">
        <h1>냥줍쉼터</h1>
        <span id="shelter-name">빈 공터</span>
      </div>
      <div class="header-center">
        <div class="level-bar">
          <div class="level-fill" id="level-fill"></div>
          <span class="level-text" id="level-text">Lv.1 (0/50 XP)</span>
        </div>
      </div>
      <div class="header-right">
        <span id="furball-count">0</span>
        <img src="assets/furballs/furball_golden.png" class="icon" alt="furball">
      </div>
      <div class="header-actions">
        <!-- Feature #1: Screenshot Share -->
        <button class="header-icon-btn" id="share-btn" title="스크린샷 공유">📷</button>
        <!-- Feature #2: Shelter URL Share -->
        <button class="header-icon-btn" id="shelter-share-btn" title="쉼터 URL 공유">🔗</button>
        <!-- Feature #7: Settings -->
        <button class="header-icon-btn" id="settings-btn" title="설정">⚙️</button>
        <div id="settings-panel" class="hidden">
          <div class="setting-row">
            <label>고양이 속도</label>
            <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
            <span class="speed-value" id="speed-value">1.0x</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="game-field" class="field-level-1"></div>
      <aside id="sidebar">
        <div class="sidebar-section" id="gacha-section">
          <h2>냥챠 머신</h2>
          <div id="gacha-machine-visual">
            <div class="gacha-window"></div>
          </div>
          <button id="gacha-btn" disabled>가챠 돌리기 (10 털뭉치)</button>
          <div class="gacha-cost">보유: <span id="sidebar-furball-count">0</span> 털뭉치</div>
        </div>
        <div class="sidebar-section" id="inventory-section">
          <h2>인벤토리</h2>
          <div id="inventory"></div>
          <p style="font-size:11px; color:#B0A0B8; margin-top:6px; text-align:center;">아이템을 클릭 후 필드에 배치하세요</p>
        </div>
        <div class="sidebar-section" id="cat-section">
          <h2>방문 고양이</h2>
          <div id="cat-list"></div>
        </div>
        <!-- Feature #3: Achievements -->
        <div class="sidebar-section" id="achievement-section">
          <h2>업적</h2>
          <div id="badge-grid"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Gacha Modal -->
  <div id="gacha-modal" class="hidden">
    <div class="gacha-overlay"></div>
    <div class="gacha-result">
      <div class="gacha-capsule" id="gacha-capsule"></div>
      <div class="gacha-item-reveal hidden" id="gacha-reveal">
        <div class="rarity-badge" id="rarity-badge"></div><br>
        <img id="gacha-item-img" alt="item">
        <h3 id="gacha-item-name"></h3>
        <p id="gacha-item-desc"></p>
        <button id="gacha-confirm-btn">확인</button>
      </div>
    </div>
  </div>

  <!-- Name Edit Modal (Feature #5) -->
  <div id="name-modal" class="hidden">
    <div class="name-modal-overlay"></div>
    <div class="name-modal-content">
      <img id="name-modal-img" alt="cat">
      <h3 id="name-modal-title">이름 짓기</h3>
      <input type="text" id="name-modal-input" maxlength="8" placeholder="이름 (최대 8자)">
      <div class="name-modal-buttons">
        <button class="btn-cancel" id="name-cancel-btn">취소</button>
        <button class="btn-confirm" id="name-confirm-btn">확인</button>
      </div>
    </div>
  </div>

  <!-- Share Card Overlay (Feature #1) -->
  <div id="share-card-overlay" class="hidden">
    <div class="share-card-container">
      <div class="share-card-buttons">
        <button class="btn-share" id="share-download-btn">이미지 저장</button>
        <button class="btn-close-share" id="share-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="placement-hint">아이템을 배치할 위치를 클릭하세요 (우클릭: 취소)</div>

  <div id="intro-overlay">
    <div class="intro-content">
      <h1>냥줍쉼터</h1>
      <p>
        어느 날 빈 공터를 발견했습니다.<br>
        그곳에 하나둘 길고양이들이 찾아오기 시작하고,<br>
        고양이들이 떨어뜨리는 털뭉치에는<br>
        신비한 힘이 깃들어 있었습니다.<br><br>
        털뭉치로 <b style="color:#FF6B8A">냥챠 머신</b>을 돌려<br>
        고양이들을 위한 쉼터를 꾸며주세요!
      </p>
      <button id="start-btn">시작하기</button>
    </div>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
