<svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Glow -->
  <rect x="2" y="0" width="8" height="1" fill="#FFD700" opacity="0.2"/>
  <rect x="0" y="2" width="1" height="7" fill="#FFD700" opacity="0.2"/>
  <rect x="11" y="2" width="1" height="7" fill="#FFD700" opacity="0.2"/>
  <rect x="2" y="10" width="8" height="1" fill="#FFD700" opacity="0.2"/>
