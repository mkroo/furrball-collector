<svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Body (white base) -->
  <rect x="3" y="1" width="6" height="1" fill="#F0EDE8"/>
  <rect x="2" y="2" width="8" height="1" fill="#F0EDE8"/>
  <rect x="1" y="3" width="10" height="5" fill="#F0EDE8"/>
  <rect x="2" y="8" width="8" height="1" fill="#F0EDE8"/>
  <rect x="3" y="9" width="6" height="1" fill="#F0EDE8"/>
  <!-- Orange patches -->
  <rect x="2" y="2" width="3" height="2" fill="#F0A050"/>
  <rect x="1" y="6" width="2" height="2" fill="#F0A050"/>
  <rect x="7" y="8" width="3" height="1" fill="#F0A050"/>
  <!-- Dark patches -->
  <rect x="8" y="3" width="2" height="2" fill="#505050"/>
  <rect x="3" y="7" width="2" height="2" fill="#505050"/>
  <!-- Eyes -->
  <rect x="4" y="5" width="1" height="1" fill="#C8A030"/>
  <rect x="7" y="5" width="1" height="1" fill="#C8A030"/>
  <!-- Mouth -->
  <rect x="5" y="7" width="2" height="1" fill="#D0A090" opacity="0.6"/>
</svg>
