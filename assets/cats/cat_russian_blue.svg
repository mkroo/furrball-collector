<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Ears -->
  <rect x="3" y="0" width="2" height="1" fill="#8898A8"/>
  <rect x="10" y="0" width="2" height="1" fill="#8898A8"/>
  <rect x="2" y="1" width="4" height="1" fill="#8898A8"/>
  <rect x="9" y="1" width="4" height="1" fill="#8898A8"/>
  <rect x="3" y="1" width="1" height="1" fill="#C0B0C8"/>
  <rect x="11" y="1" width="1" height="1" fill="#C0B0C8"/>
  <!-- Head -->
  <rect x="2" y="2" width="11" height="1" fill="#8898A8"/>
  <rect x="1" y="3" width="13" height="4" fill="#8898A8"/>
  <rect x="2" y="7" width="11" height="1" fill="#8898A8"/>
  <!-- Subtle shading -->
  <rect x="1" y="3" width="1" height="4" fill="#788898"/>
  <rect x="13" y="3" width="1" height="4" fill="#788898"/>
  <!-- Eyes (green) -->
  <rect x="4" y="4" width="2" height="2" fill="#D0FFD0"/>
  <rect x="9" y="4" width="2" height="2" fill="#D0FFD0"/>
  <rect x="5" y="5" width="1" height="1" fill="#408040"/>
  <rect x="10" y="5" width="1" height="1" fill="#408040"/>
  <!-- Nose -->
  <rect x="7" y="6" width="1" height="1" fill="#B0A0B8"/>
  <!-- Body -->
  <rect x="3" y="8" width="9" height="1" fill="#8898A8"/>
  <rect x="2" y="9" width="11" height="2" fill="#8898A8"/>
  <rect x="2" y="9" width="1" height="2" fill="#788898"/>
  <rect x="12" y="9" width="1" height="2" fill="#788898"/>
  <!-- Paws -->
  <rect x="2" y="11" width="3" height="1" fill="#8898A8"/>
  <rect x="6" y="11" width="3" height="1" fill="#8898A8"/>
  <rect x="10" y="11" width="3" height="1" fill="#8898A8"/>
  <!-- Tail -->
  <rect x="13" y="9" width="1" height="1" fill="#8898A8"/>
  <rect x="14" y="7" width="1" height="2" fill="#8898A8"/>
</svg>
