<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="16" ry="3" fill="rgba(0,0,0,0.08)"/>
  <!-- Tail -->
  <path d="M44 48 C52 44, 56 36, 54 28 C52 22, 54 18, 58 14" fill="none" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
  <path d="M44 48 C52 44, 56 36, 54 28 C52 22, 54 18, 58 14" fill="none" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="32" cy="50" rx="13" ry="9" fill="#3A3A3A"/>
  <!-- Paws -->
  <ellipse cx="23" cy="57" rx="5.5" ry="3.5" fill="#3A3A3A"/>
  <ellipse cx="41" cy="57" rx="5.5" ry="3.5" fill="#3A3A3A"/>
  <circle cx="21.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="24.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="39.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="42.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
  <!-- Head -->
  <circle cx="32" cy="27" r="19" fill="#3A3A3A"/>
  <!-- Chin spot -->
  <ellipse cx="32" cy="38" rx="3" ry="2" fill="#F0F0F0" opacity="0.3"/>
  <!-- Ears outer -->
  <polygon points="14,18 19,1 28,14" fill="#3A3A3A"/>
  <polygon points="36,14 45,1 50,18" fill="#3A3A3A"/>
  <!-- Ears inner -->
  <polygon points="17,16 20,5 26,13" fill="#FF9EAF"/>
  <polygon points="38,13 44,5 47,16" fill="#FF9EAF"/>
  <!-- Eyes (big golden eyes!) -->
  <ellipse cx="24" cy="26" rx="6.5" ry="7" fill="white"/>
  <ellipse cx="40" cy="26" rx="6.5" ry="7" fill="white"/>
  <ellipse cx="25" cy="27" rx="5" ry="5.5" fill="#F0C040"/>
  <ellipse cx="41" cy="27" rx="5" ry="5.5" fill="#F0C040"/>
  <ellipse cx="25.5" cy="27.5" rx="3" ry="3.5" fill="#B8860B"/>
  <ellipse cx="41.5" cy="27.5" rx="3" ry="3.5" fill="#B8860B"/>
  <!-- Eye highlights -->
  <circle cx="23" cy="24" r="2.5" fill="white"/>
  <circle cx="39" cy="24" r="2.5" fill="white"/>
  <circle cx="27" cy="29.5" r="1" fill="white" opacity="0.7"/>
  <circle cx="43" cy="29.5" r="1" fill="white" opacity="0.7"/>
  <!-- Nose -->
  <path d="M30.5,32.5 L33.5,32.5 L32,34.5 Z" fill="#FF8888"/>
  <!-- Mouth -->
  <path d="M28,36 Q30,38 32,36 Q34,38 36,36" fill="none" stroke="#555555" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="15" cy="31" rx="4" ry="2.5" fill="#FF8FAB" opacity="0.4"/>
  <ellipse cx="49" cy="31" rx="4" ry="2.5" fill="#FF8FAB" opacity="0.4"/>
  <!-- Whiskers -->
  <line x1="8" y1="30" x2="17" y2="32" stroke="#666666" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="34" x2="17" y2="33" stroke="#666666" stroke-width="0.8" opacity="0.4"/>
  <line x1="47" y1="32" x2="56" y2="30" stroke="#666666" stroke-width="0.8" opacity="0.4"/>
  <line x1="47" y1="33" x2="56" y2="34" stroke="#666666" stroke-width="0.8" opacity="0.4"/>
</svg>
