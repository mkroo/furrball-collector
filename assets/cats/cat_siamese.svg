<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Ears (dark points) -->
  <rect x="3" y="0" width="2" height="1" fill="#705040"/>
  <rect x="10" y="0" width="2" height="1" fill="#705040"/>
  <rect x="2" y="1" width="4" height="1" fill="#705040"/>
  <rect x="9" y="1" width="4" height="1" fill="#705040"/>
  <rect x="3" y="1" width="1" height="1" fill="#FF9EAF"/>
  <rect x="11" y="1" width="1" height="1" fill="#FF9EAF"/>
  <!-- Head (cream) -->
  <rect x="2" y="2" width="11" height="1" fill="#F0E0D0"/>
  <rect x="1" y="3" width="13" height="4" fill="#F0E0D0"/>
  <rect x="2" y="7" width="11" height="1" fill="#F0E0D0"/>
  <!-- Dark face mask -->
  <rect x="6" y="5" width="3" height="2" fill="#806050"/>
  <rect x="7" y="4" width="1" height="1" fill="#806050"/>
  <!-- Eyes (blue) -->
  <rect x="4" y="4" width="2" height="2" fill="#D0E8FF"/>
  <rect x="9" y="4" width="2" height="2" fill="#D0E8FF"/>
  <rect x="5" y="5" width="1" height="1" fill="#4488CC"/>
  <rect x="10" y="5" width="1" height="1" fill="#4488CC"/>
  <!-- Nose -->
  <rect x="7" y="6" width="1" height="1" fill="#806050"/>
  <!-- Body (cream) -->
  <rect x="3" y="8" width="9" height="1" fill="#F0E0D0"/>
  <rect x="2" y="9" width="11" height="2" fill="#F0E0D0"/>
  <!-- Paws (dark points) -->
  <rect x="2" y="11" width="3" height="1" fill="#705040"/>
  <rect x="6" y="11" width="3" height="1" fill="#F0E0D0"/>
  <rect x="10" y="11" width="3" height="1" fill="#705040"/>
  <!-- Tail (dark point) -->
  <rect x="13" y="9" width="1" height="1" fill="#705040"/>
  <rect x="14" y="7" width="1" height="2" fill="#705040"/>
</svg>
