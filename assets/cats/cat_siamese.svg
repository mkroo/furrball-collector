  <path d="M44 48 C52 44, 56 36, 54 28 C52 22, 54 18, 58 14" fill="none" stroke="#6B4E3D" stroke-width="5" stroke-linecap="round"/>
  <path d="M44 48 C52 44, 56 36, 54 28 C52 22, 54 18, 58 14" fill="none" stroke="#8B6E5D" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="32" cy="50" rx="13" ry="9" fill="#F5E6D3"/>
  <!-- Paws (dark points) -->
  <ellipse cx="23" cy="57" rx="5.5" ry="3.5" fill="#6B4E3D"/>
  <ellipse cx="41" cy="57" rx="5.5" ry="3.5" fill="#6B4E3D"/>
  <circle cx="21.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
