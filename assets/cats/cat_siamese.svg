  <circle cx="39.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="42.5" cy="58" r="1.2" fill="#FFB6C1" opacity="0.7"/>
  <!-- Head -->
  <circle cx="32" cy="27" r="19" fill="#F5E6D3"/>
  <!-- Face mask (dark points) -->
  <ellipse cx="32" cy="30" rx="10" ry="7" fill="#6B4E3D" opacity="0.35"/>
  <!-- Ears outer (dark points) -->
  <polygon points="14,18 19,1 28,14" fill="#6B4E3D"/>
  <polygon points="36,14 45,1 50,18" fill="#6B4E3D"/>
  <!-- Ears inner -->
  <polygon points="17,16 20,5 26,13" fill="#FF9EAF"/>
  <polygon points="38,13 44,5 47,16" fill="#FF9EAF"/>
  <!-- Eyes (striking blue!) -->
  <ellipse cx="24" cy="26" rx="6" ry="6.5" fill="white"/>
  <ellipse cx="40" cy="26" rx="6" ry="6.5" fill="white"/>
  <ellipse cx="25" cy="27" rx="4.5" ry="5" fill="#5B9BD5"/>
  <ellipse cx="41" cy="27" rx="4.5" ry="5" fill="#5B9BD5"/>
  <ellipse cx="25.5" cy="27.5" rx="3" ry="3.5" fill="#2C5F8A"/>
  <ellipse cx="41.5" cy="27.5" rx="3" ry="3.5" fill="#2C5F8A"/>
  <!-- Eye highlights -->
  <circle cx="23" cy="24.5" r="2.2" fill="white"/>
  <circle cx="39" cy="24.5" r="2.2" fill="white"/>
  <circle cx="27" cy="29" r="1" fill="white" opacity="0.7"/>
  <circle cx="43" cy="29" r="1" fill="white" opacity="0.7"/>
  <!-- Nose -->
  <path d="M30.5,32.5 L33.5,32.5 L32,34.5 Z" fill="#C08080"/>
