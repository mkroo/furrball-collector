  <path d="M28,36 Q30,38 32,36 Q34,38 36,36" fill="none" stroke="#8B6950" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="15" cy="31" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="49" cy="31" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.5"/>
  <!-- Whiskers -->
  <line x1="8" y1="30" x2="17" y2="32" stroke="#A08878" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="34" x2="17" y2="33" stroke="#A08878" stroke-width="0.8" opacity="0.4"/>
  <line x1="47" y1="32" x2="56" y2="30" stroke="#A08878" stroke-width="0.8" opacity="0.4"/>
  <line x1="47" y1="33" x2="56" y2="34" stroke="#A08878" stroke-width="0.8" opacity="0.4"/>
