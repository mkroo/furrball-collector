<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Ears -->
  <rect x="3" y="0" width="2" height="1" fill="#404040"/>
  <rect x="10" y="0" width="2" height="1" fill="#404040"/>
  <rect x="2" y="1" width="4" height="1" fill="#404040"/>
  <rect x="9" y="1" width="4" height="1" fill="#404040"/>
  <rect x="3" y="1" width="1" height="1" fill="#FF9EAF"/>
  <rect x="11" y="1" width="1" height="1" fill="#FF9EAF"/>
  <!-- Head (black) -->
  <rect x="2" y="2" width="11" height="1" fill="#404040"/>
  <rect x="1" y="3" width="13" height="4" fill="#404040"/>
  <rect x="2" y="7" width="11" height="1" fill="#404040"/>
  <!-- White face marking -->
  <rect x="5" y="5" width="5" height="2" fill="#F0EDE8"/>
  <rect x="6" y="4" width="3" height="1" fill="#F0EDE8"/>
  <!-- Eyes -->
  <rect x="4" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="9" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="5" y="5" width="1" height="1" fill="#508050"/>
  <rect x="10" y="5" width="1" height="1" fill="#508050"/>
  <!-- Nose -->
  <rect x="7" y="6" width="1" height="1" fill="#FF8888"/>
  <!-- Body (black) -->
  <rect x="3" y="8" width="9" height="1" fill="#404040"/>
  <rect x="2" y="9" width="11" height="2" fill="#404040"/>
  <!-- White bib -->
  <rect x="5" y="8" width="5" height="1" fill="#F0EDE8"/>
  <rect x="4" y="9" width="7" height="2" fill="#F0EDE8"/>
  <!-- Paws (white) -->
  <rect x="2" y="11" width="3" height="1" fill="#F0EDE8"/>
  <rect x="6" y="11" width="3" height="1" fill="#F0EDE8"/>
  <rect x="10" y="11" width="3" height="1" fill="#F0EDE8"/>
  <!-- Tail -->
  <rect x="13" y="9" width="1" height="1" fill="#404040"/>
  <rect x="14" y="7" width="1" height="2" fill="#404040"/>
</svg>
