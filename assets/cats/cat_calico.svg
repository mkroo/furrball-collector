<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Ears -->
  <rect x="3" y="0" width="2" height="1" fill="#F0A050"/>
  <rect x="10" y="0" width="2" height="1" fill="#505050"/>
  <rect x="2" y="1" width="4" height="1" fill="#F0A050"/>
  <rect x="9" y="1" width="4" height="1" fill="#505050"/>
  <rect x="3" y="1" width="1" height="1" fill="#FFB0B0"/>
  <rect x="11" y="1" width="1" height="1" fill="#FFB0B0"/>
  <!-- Head -->
  <rect x="2" y="2" width="11" height="1" fill="#F0EDE8"/>
  <rect x="1" y="3" width="13" height="4" fill="#F0EDE8"/>
  <rect x="2" y="7" width="11" height="1" fill="#F0EDE8"/>
  <!-- Orange patches on head -->
  <rect x="2" y="2" width="3" height="1" fill="#F0A050"/>
  <rect x="1" y="3" width="3" height="2" fill="#F0A050"/>
  <!-- Dark patches on head -->
  <rect x="10" y="2" width="3" height="1" fill="#505050"/>
  <rect x="11" y="3" width="2" height="2" fill="#505050"/>
  <!-- Eyes -->
  <rect x="4" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="9" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="5" y="5" width="1" height="1" fill="#C8A030"/>
  <rect x="10" y="5" width="1" height="1" fill="#C8A030"/>
  <!-- Nose -->
  <rect x="7" y="6" width="1" height="1" fill="#FF8888"/>
  <!-- Body -->
  <rect x="3" y="8" width="9" height="1" fill="#F0EDE8"/>
  <rect x="2" y="9" width="11" height="2" fill="#F0EDE8"/>
  <!-- Body patches -->
  <rect x="3" y="8" width="2" height="1" fill="#F0A050"/>
  <rect x="2" y="9" width="3" height="2" fill="#F0A050"/>
  <rect x="9" y="9" width="2" height="2" fill="#505050"/>
  <!-- Paws -->
  <rect x="2" y="11" width="3" height="1" fill="#F0A050"/>
  <rect x="6" y="11" width="3" height="1" fill="#F0EDE8"/>
  <rect x="10" y="11" width="3" height="1" fill="#505050"/>
  <!-- Tail -->
  <rect x="13" y="9" width="1" height="1" fill="#F0A050"/>
  <rect x="14" y="7" width="1" height="2" fill="#F0A050"/>
</svg>
